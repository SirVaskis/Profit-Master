apiVersion: 1
datasources:
  - name: Profit Market PostgreSQL
    uid: profitmarket-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $MARKET_DB_HOST
    user: market_reader
    isDefault: true
    editable: false
    jsonData:
      database: profit_market
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
    secureJsonData:
      password: $MARKET_READER_PASSWORD
